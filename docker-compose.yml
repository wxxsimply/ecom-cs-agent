services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      APP_DB_PATH: /app/dbdata/app.db
      CHECKPOINT_DB: /app/dbdata/checkpoints.db
      KNOWLEDGE_DIR: /app/data/knowledge
      DEMO_USER_ID: u_demo
      LLM_MODE: ${LLM_MODE:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_STYLE: ${DEEPSEEK_API_STYLE:-auto}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - mewhelp_data:/app/dbdata
    restart: unless-stopped

volumes:
  mewhelp_data:
    name: mewhelp_data
